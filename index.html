<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Management System</title>
<style>
:root{--p1:#1d4ed8;--p2:#0ea5e9;--acc:#fbbf24;--bg:#eef4ff;--card:#fff;--ink:#1c2340;--muted:#6f7897;--line:#e0e8f8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.top{position:fixed;top:0;left:0;right:0;height:56px;z-index:20;background:linear-gradient(120deg,var(--p1),var(--p2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 4px 18px #0003}
.top h1{font-size:1.05rem;display:flex;align-items:center;gap:10px}.bg{display:none;background:#ffffff30;border:0;color:#fff;border-radius:10px;width:38px;height:38px;font-size:1.2rem;cursor:pointer}
.uc{display:flex;align-items:center;gap:8px;font-size:.85rem}.uc button{background:#ffffff30;border:0;color:#fff;border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer}
.side{position:fixed;top:56px;left:0;bottom:34px;width:220px;background:var(--card);box-shadow:4px 0 20px #0001;overflow:auto;padding:10px;z-index:15;transition:transform .25s}
.side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--ink);padding:11px 12px;border-radius:12px;font-weight:600;font-size:.95rem;cursor:pointer;text-align:left;margin-bottom:2px}
.side button:hover{background:var(--line)}.side button.on{background:linear-gradient(120deg,var(--p1),var(--p2));color:#fff}
.main{margin-left:220px;padding:70px 16px 54px;max-width:1100px}
.mq{position:fixed;left:0;right:0;bottom:0;height:34px;background:#0b1020;color:#fff;overflow:hidden;z-index:30;display:flex;align-items:center}
.mt{display:inline-block;white-space:nowrap;padding-left:100%;animation:mq 24s linear infinite;font-weight:700;font-size:.88rem;letter-spacing:.5px}.mt b{color:var(--acc)}.mq:hover .mt{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-100%)}}
h2.pt{font-size:1.35rem;margin-bottom:12px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 8px 24px #0000000d;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.stat{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 8px 24px #0000000d;border-top:4px solid var(--c,var(--p1))}.stat span{font-size:.78rem;color:var(--muted);font-weight:700}.stat b{display:block;font-size:1.6rem;margin-top:3px}
.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}.row>*{flex:1;min-width:130px}
label{font-size:.74rem;font-weight:700;color:var(--muted);display:block;margin-bottom:3px}
input,select,textarea{padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:.95rem;outline:none;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--p1)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(120deg,var(--p1),var(--p2));font-size:.92rem;transition:.15s;white-space:nowrap}.btn:hover{transform:translateY(-2px)}
.btn.sm{padding:6px 11px;font-size:.8rem}.btn.o{background:transparent;border:2px solid var(--line);color:var(--ink)}.btn.r{background:#ef4444}.btn.g{background:#10b981}.btn.a{background:var(--acc);color:#2b1c00}.btn.n{background:#334155}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.72rem;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:.92rem}tr:hover td{background:var(--bg)}
.sc{overflow-x:auto}
.pill{font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--muted);display:inline-block}.pill.ok{background:#10b98122;color:#0b8a63}.pill.bad{background:#ef444422;color:#dc2626}.pill.wn{background:#f59e0b2a;color:#a96b00}.pill.in{background:#3b82f622;color:#2563eb}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--p2));border-radius:99px}
.bl{display:grid;grid-template-columns:96px 1fr 70px;gap:10px;align-items:center;margin:9px 0;font-size:.88rem}.bl b{text-align:right}
.cols{display:flex;gap:8px;align-items:flex-end;height:150px;margin-top:8px}.cols div{flex:1;text-align:center;font-size:.7rem;color:var(--muted);font-weight:700}.cols i{display:block;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--p2),var(--p1));min-height:4px;margin-bottom:4px}.cols u{display:block;text-decoration:none;color:var(--ink);font-size:.72rem}
.empty{text-align:center;color:var(--muted);padding:26px}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem;align-items:center}.li small{color:var(--muted);display:block}
.pa{display:flex;gap:5px}.pa button{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--muted);font-weight:800;cursor:pointer}.pa .P.on{background:#10b981;border-color:#10b981;color:#fff}.pa .A.on{background:#ef4444;border-color:#ef4444;color:#fff}.pa .L.on{background:#f59e0b;border-color:#f59e0b;color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:2px solid var(--line);background:transparent;color:var(--ink);padding:5px 14px;border-radius:99px;cursor:pointer;font-weight:700;font-size:.85rem}.chip.on{background:var(--p1);border-color:var(--p1);color:#fff}
dialog{border:0;border-radius:20px;padding:0;width:min(520px,94vw);max-height:92vh;overflow:auto;background:var(--card);color:var(--ink);box-shadow:0 30px 80px #0008}dialog::backdrop{background:#0009}
.dh{padding:16px 18px;background:linear-gradient(120deg,var(--p1),var(--p2));color:#fff;font-weight:800;font-size:1.05rem}.db{padding:16px 18px}.df{display:flex;gap:10px;justify-content:flex-end;padding:0 18px 16px}
.lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,var(--p1),var(--p2))}.lg .card{max-width:380px;width:100%;padding:26px}.lg h1{font-size:1.5rem;margin-bottom:4px}
.note{background:#fff3d6;color:#6a5200;border-radius:12px;padding:10px 14px;font-size:.85rem;margin-bottom:12px}
#toast{position:fixed;bottom:48px;left:50%;transform:translate(-50%,80px);background:#111827;color:#fff;padding:11px 20px;border-radius:99px;transition:.3s;opacity:0;z-index:50;max-width:90%;text-align:center}#toast.show{transform:translate(-50%,0);opacity:1}
#pr{display:none}
@media(max-width:900px){.bg{display:block}.side{transform:translateX(-105%)}.side.open{transform:none}.main{margin-left:0}.uc span{display:none}.top h1{font-size:.95rem}}
@media(max-width:640px){table.rt thead{display:none}table.rt tr,table.rt td{display:block}table.rt tr{border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:10px}table.rt td{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border:0;gap:10px;text-align:right}table.rt td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:.7rem;font-weight:700;text-transform:uppercase;text-align:left}.row>*{min-width:100%}.main{padding:70px 10px 54px}.bl{grid-template-columns:76px 1fr 56px}}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;color:#000;background:#fff;padding:20px}#pr table{font-size:13px}.noprint{display:none!important}}

</style>
</head>
<body>
<script>
const CLS=()=>DB.classes.map(c=>c.name),TCH=()=>DB.teachers.map(t=>t.name),GR=p=>p==null?'-':p>=80?'A':p>=70?'B':p>=60?'C':p>=50?'D':'F',GC={A:'ok',B:'in',C:'wn',D:'wn',F:'bad','-':''};
const SUBS=()=>ST().subjects.split(',').map(s=>s.trim()).filter(Boolean),act=()=>DB.students.filter(s=>s.status!='Left');
const attPct=id=>{let p=0,t=0;Object.values(DB.att).forEach(d=>{if(d[id]){t++;if(d[id]!='A')p++}});return t?Math.round(p/t*100):null};
const sAvg=(id,t)=>{const g=((DB.scores[t]||{})[id])||{},v=SUBS().map(k=>g[k]).filter(x=>x!==''&&x!=null&&!isNaN(x));return v.length?v.reduce((a,b)=>a+ +b,0)/v.length:null};
const feeOf=s=>+DB.fees[s.cls]||0,paid=(id,t)=>DB.payments.filter(p=>p.sid==id&&p.term==t).reduce((a,p)=>a+p.amt,0),bal=(s,t)=>feeOf(s)-paid(s.id,t);
const APP={key:'school_ms',title:'School Management System',icon:'🏫',
sfields:[{k:'name',l:'School name'},{k:'motto',l:'Motto'},{k:'phone',l:'School phone'},{k:'cur',l:'Currency symbol'},{k:'year',l:'Academic year'},{k:'term',l:'Current term',t:'select',o:['1','2','3']},{k:'subjects',l:'Subjects (comma separated)'}],
seed(){const C=['Class 1','Class 2','Class 3','Class 4','Class 5','Class 6'],T=[['Mrs. Akosua Mensah','English','Class 1'],['Mr. Kwame Owusu','Mathematics','Class 2'],['Ms. Ama Boateng','Science','Class 3'],['Mr. Yaw Adu','Social Studies','Class 4'],['Mrs. Efua Tetteh','ICT','Class 5'],['Mr. Kofi Asare','RME','Class 6']];
 const N=['Ama Mensah','Kofi Boateng','Esi Owusu','Yaw Adu','Abena Tetteh','Kwesi Asare','Akua Darko','Nana Yeboah','Efua Quaye','Kojo Antwi','Adwoa Sarpong','Yaa Frimpong'];
 const st=N.map((n,i)=>({id:uid(),adm:'ADM-'+String(i+1).padStart(3,'0'),name:n,cls:C[i%6],gender:i%2?'Male':'Female',dob:'201'+(i%4)+'-0'+(i%9+1)+'-1'+(i%9),parent:'Parent of '+n.split(' ')[0],phone:'024 000 00'+String(i+10),address:'Accra',status:'Active'}));
 const sc={'1':{}};st.forEach((s,i)=>{sc['1'][s.id]={};['Math','English','Science','Social Studies','ICT','RME'].forEach((k,j)=>sc['1'][s.id][k]=45+((i*13+j*17)%52))});
 const fees={};C.forEach((c,i)=>fees[c]=300+i*50);const pay=st.slice(0,8).map((s,i)=>({id:uid(),sid:s.id,term:'1',amt:i%3==0?fees[s.cls]:Math.round(fees[s.cls]/2),date:td(),method:['Cash','Mobile Money','Bank'][i%3],note:'',rc:'RC-'+String(i+1).padStart(4,'0')}));
 const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
 return{settings:{name:'Bright Future Academy',motto:'Knowledge is power',phone:'',cur:'GH₵',year:'2026/2027',term:'1',subjects:'Math,English,Science,Social Studies,ICT,RME'},
 classes:C.map((c,i)=>({id:uid(),name:c,teacher:T[i][0],room:'Room '+(i+1),cap:35})),teachers:T.map((t,i)=>({id:uid(),name:t[0],subject:t[1],cls:t[2],phone:'020 111 00'+(i+10),email:'',salary:1800+i*100,status:'Active',hired:'2020-09-01'})),
 students:st,att:{},scores:sc,fees,payments:pay,tt:{},events:[{id:uid(),title:'Parents meeting',date:d(5),aud:'Parents',note:'School hall, 9am'},{id:uid(),title:'Inter-house sports',date:d(12),aud:'Everyone',note:''},{id:uid(),title:'Mid-term exams begin',date:d(20),aud:'Students',note:''}],
 notices:[{id:uid(),title:'Welcome back!',date:td(),body:'School reopens. Please make sure fees are paid before the mid-term.'},{id:uid(),title:'Uniform reminder',date:td(),body:'All pupils should wear the full school uniform every day.'}]}},
mods:[
{id:'dash',i:'📊',l:'Dashboard',render:dash},
{id:'stu',i:'🎒',l:'Students',render:el=>crud(el,{key:'students',title:'student',filter:{k:'cls',l:'classes',o:CLS},init:o=>o.adm='ADM-'+String(DB.students.length+1).padStart(3,'0'),
  fields:[{k:'adm',l:'Adm. No',auto:1},{k:'name',l:'Full name',req:1},{k:'cls',l:'Class',t:'select',o:CLS,req:1,nb:1},{k:'gender',l:'Gender',t:'select',o:['Female','Male']},{k:'dob',l:'Date of birth',t:'date',list:false},{k:'parent',l:'Parent / guardian'},{k:'phone',l:'Parent phone',t:'tel'},{k:'address',l:'Address',list:false},{k:'status',l:'Status',t:'select',o:['Active','Left'],nb:1,d:'Active',fmt:v=>`<span class="pill ${v=='Active'?'ok':'bad'}">${v}</span>`}],
  acts:[{l:'Profile',fn:'prof_'}]})},
{id:'tch',i:'👩‍🏫',l:'Teachers',render:el=>crud(el,{key:'teachers',title:'teacher',fields:[{k:'name',l:'Full name',req:1},{k:'subject',l:'Subject'},{k:'cls',l:'Class',t:'select',o:CLS},{k:'phone',l:'Phone',t:'tel'},{k:'email',l:'Email',t:'email',list:false},{k:'salary',l:'Salary',t:'number',fmt:v=>money(v),list:false},{k:'hired',l:'Date hired',t:'date',list:false},{k:'status',l:'Status',t:'select',o:['Active','On leave','Left'],nb:1,d:'Active',fmt:v=>`<span class="pill ${v=='Active'?'ok':'wn'}">${v}</span>`}]})},
{id:'cls',i:'🏷️',l:'Classes',render:el=>crud(el,{key:'classes',title:'class',fields:[{k:'name',l:'Class name',req:1},{k:'teacher',l:'Class teacher',t:'select',o:TCH},{k:'room',l:'Room'},{k:'cap',l:'Capacity',t:'number'},{k:'n',l:'Pupils',auto:1,fmt:(v,r)=>DB.students.filter(s=>s.cls==r.name&&s.status!='Left').length}]})},
{id:'att',i:'✅',l:'Attendance',render:attMod},
{id:'grd',i:'📝',l:'Grades & Reports',render:grdMod},
{id:'fee',i:'💰',l:'Fees',admin:1,render:feeMod},
{id:'tt',i:'🗓️',l:'Timetable',render:ttMod},
{id:'evt',i:'🎉',l:'Events',render:el=>crud(el,{key:'events',title:'event',fields:[{k:'title',l:'Title',req:1},{k:'date',l:'Date',t:'date',req:1,fmt:fdate},{k:'aud',l:'For',t:'select',o:['Everyone','Parents','Students','Teachers'],nb:1},{k:'note',l:'Details',t:'textarea'}]})},
{id:'not',i:'📢',l:'Notices',render:el=>crud(el,{key:'notices',title:'notice',fields:[{k:'title',l:'Title',req:1},{k:'date',l:'Date',t:'date',d:td(),fmt:fdate},{k:'body',l:'Message',t:'textarea',req:1}]})},
{id:'rep',i:'🖨️',l:'Reports',admin:1,render:repMod},
{id:'set',i:'⚙️',l:'Settings',admin:1,render:settings}]};
/* ---------- dashboard ---------- */
function dash(el){const S=act(),t=ST().term,exp=S.reduce((a,s)=>a+feeOf(s),0),col=DB.payments.filter(p=>p.term==t).reduce((a,p)=>a+p.amt,0),tdAtt=DB.att[td()]||{},pk=Object.values(tdAtt),prs=pk.filter(x=>x!='A').length;
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=d.toISOString().slice(0,10),a=Object.values(DB.att[k]||{});return{l:d.toLocaleDateString([],{weekday:'short'}),v:a.length?Math.round(a.filter(x=>x!='A').length/a.length*100):0,t:a.length?Math.round(a.filter(x=>x!='A').length/a.length*100)+'%':'–'}});
 el.innerHTML=`<div class="grid">${stat('Students',S.length,'#2563eb')}${stat('Teachers',DB.teachers.filter(x=>x.status=='Active').length,'#f59e0b')}${stat('Classes',DB.classes.length,'#10b981')}${stat("Today's attendance",pk.length?Math.round(prs/pk.length*100)+'%':'–','#8b5cf6')}${isAdmin()?stat('Fees collected (T'+t+')',money(col),'#10b981')+stat('Outstanding',money(Math.max(0,exp-col)),'#ef4444'):''}</div>
 <div class="g2"><div class="card"><h3>Pupils per class</h3>${bars(DB.classes.map(c=>({l:c.name,v:S.filter(s=>s.cls==c.name).length})))}</div><div class="card"><h3>Attendance, last 7 days</h3>${cols(days)}</div>
 <div class="card"><h3 style="margin-bottom:6px">Upcoming events</h3>${DB.events.filter(e=>e.date>=td()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(e=>`<div class="li"><div><b>${esc(e.title)}</b><small>${esc(e.aud)} ${e.note?'· '+esc(e.note):''}</small></div><span class="pill in">${fdate(e.date)}</span></div>`).join('')||'<div class="empty">No upcoming events</div>'}</div>
 <div class="card"><h3 style="margin-bottom:6px">Notices</h3>${DB.notices.slice(-4).reverse().map(n=>`<div class="li"><div><b>${esc(n.title)}</b><small>${esc(n.body)}</small></div></div>`).join('')||'<div class="empty">No notices</div>'}</div></div>`}
/* ---------- profile ---------- */
window.prof_=id=>{const s=DB.students.find(x=>x.id==id),t=ST().term,a=sAvg(id,t),p=attPct(id);modal(esc(s.name),`<div class="li"><span>Adm. No</span><b>${s.adm}</b></div><div class="li"><span>Class</span><b>${s.cls}</b></div><div class="li"><span>Gender / DOB</span><b>${s.gender} · ${fdate(s.dob)||'-'}</b></div><div class="li"><span>Parent</span><b>${esc(s.parent)} · ${esc(s.phone)}</b></div><div class="li"><span>Attendance</span><b>${p==null?'-':p+'%'}</b></div><div class="li"><span>Term ${t} average</span><b>${a==null?'-':a.toFixed(1)+' ('+GR(a)+')'}</b></div>${isAdmin()?`<div class="li"><span>Fee balance (T${t})</span><b>${money(bal(s,t))}</b></div>`:''}`)};
/* ---------- attendance ---------- */
function attMod(el){let c=CLS()[0],d=td();const draw=()=>{const L=act().filter(s=>s.cls==c),day=DB.att[d]||{},n=k=>L.filter(s=>day[s.id]==k).length;
 el.innerHTML=`<div class="card"><div class="row"><div><label>Class</label><select id="ac">${CLS().map(x=>`<option ${x==c?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Date</label><input id="ad" type="date" value="${d}"></div><div style="flex:none"><button class="btn g" id="aa">All present</button></div></div><div class="grid" style="grid-template-columns:repeat(3,1fr)">${stat('Present',n('P'),'#10b981')}${stat('Absent',n('A'),'#ef4444')}${stat('Late',n('L'),'#f59e0b')}</div>
 ${L.map(s=>{const p=attPct(s.id);return`<div class="li"><div><b>${esc(s.name)}</b><small>${p==null?'No record':p+'% overall'}</small></div><div class="pa">${['P','A','L'].map(k=>`<button class="${k} ${day[s.id]==k?'on':''}" onclick="mk_('${s.id}','${k}')">${k}</button>`).join('')}</div></div>`}).join('')||'<div class="empty">No pupils in this class.</div>'}</div>`;
 $('ac').onchange=e=>{c=e.target.value;draw()};$('ad').onchange=e=>{d=e.target.value||td();draw()};$('aa').onclick=()=>{DB.att[d]=DB.att[d]||{};L.forEach(s=>DB.att[d][s.id]='P');save();draw();toast('All marked present')}};
 window.mk_=(id,k)=>{DB.att[d]=DB.att[d]||{};if(DB.att[d][id]==k)delete DB.att[d][id];else DB.att[d][id]=k;save();draw()};draw()}
/* ---------- grades ---------- */
function grdMod(el){let c=CLS()[0],t=ST().term;const draw=()=>{const L=act().filter(s=>s.cls==c),S=SUBS();DB.scores[t]=DB.scores[t]||{};
 el.innerHTML=`<div class="card"><div class="row"><div><label>Class</label><select id="gc">${CLS().map(x=>`<option ${x==c?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Term</label><select id="gt">${['1','2','3'].map(x=>`<option ${x==t?'selected':''}>${x}</option>`).join('')}</select></div></div><p class="note">Type scores out of 100. Averages, grades and positions update automatically.</p><div class="sc"><table><thead><tr><th>Pupil</th>${S.map(s=>`<th>${esc(s)}</th>`).join('')}<th>Avg</th><th>Grade</th><th>Pos</th><th></th></tr></thead><tbody>${L.map(s=>`<tr><td><b>${esc(s.name)}</b></td>${S.map(k=>`<td><input style="width:68px;padding:6px;text-align:center" type="number" min="0" max="100" value="${(DB.scores[t][s.id]||{})[k]??''}" oninput="sc_('${s.id}','${esc(k)}',this)"></td>`).join('')}<td id="av${s.id}"></td><td id="gr${s.id}"></td><td id="ps${s.id}"></td><td><button class="btn sm n" onclick="rc_('${s.id}')">Report</button></td></tr>`).join('')}</tbody></table></div></div>`;
 $('gc').onchange=e=>{c=e.target.value;draw()};$('gt').onchange=e=>{t=e.target.value;draw()};rk()};
 const rk=()=>{const L=act().filter(s=>s.cls==c),r=L.map(s=>({s,a:sAvg(s.id,t)})).sort((x,y)=>(y.a??-1)-(x.a??-1));L.forEach(s=>{const a=sAvg(s.id,t),g=GR(a);$('av'+s.id).textContent=a==null?'-':a.toFixed(1);$('gr'+s.id).innerHTML=`<span class="pill ${GC[g]}">${g}</span>`;$('ps'+s.id).textContent=a==null?'-':r.findIndex(x=>x.s.id==s.id)+1})};
 window.sc_=(id,k,el)=>{let v=el.value;if(v!==''){v=Math.max(0,Math.min(100,+v));if(+el.value>100)el.value=100}DB.scores[t][id]=DB.scores[t][id]||{};DB.scores[t][id][k]=v;save();rk()};

 const ul=()=>{$('ul').innerHTML=DB.users.map(u=>`<div class="li"><div><b>${esc(u.name)}</b><small>@${esc(u.u)}</small></div><span class="pill ${u.role=='admin'?'in':''}">${u.role}</span>${u.id==USER.id?'':`<button class="btn sm r" onclick="du_('${u.id}')">✕</button>`}</div>`).join('')};ul();
 window.du_=id=>{if(confirm('Remove this user?')){DB.users=DB.users.filter(u=>u.id!=id);save();ul()}};
 $('ua').onclick=()=>modal('Add user',`<div class="row"><div><label>Full name</label><input id="nn"></div><div><label>Username</label><input id="nu" autocapitalize="none"></div></div><div class="row"><div><label>Password</label><input id="ny" type="password"></div><div><label>Role</label><select id="nr"><option value="staff">Staff</option><option value="admin">Admin</option></select></div></div>`,()=>{const n=$('nn').value.trim(),u=$('nu').value.trim(),p=$('ny').value;if(!n||!u||p.length<6){toast('Fill all fields (password 6+)');return false}if(DB.users.some(x=>x.u.toLowerCase()==u.toLowerCase())){toast('Username taken');return false}sha(p).then(h=>{DB.users.push({id:uid(),name:n,u,h,role:$('nr').value});save();ul()})});
 $('bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download=APP.key+'-backup.json';a.click()};
 $('rs').onclick=()=>$('rf').click();$('rf').onchange=e=>e.target.files[0].text().then(t=>{try{const d=JSON.parse(t);if(!d.settings||!d.users)throw 0;if(confirm('Replace ALL current data with this backup?')){DB=d;save();toast('Restored');boot()}}catch(x){toast('Not a valid backup file')}});
 $('er').onclick=()=>{if(confirm('Erase ALL data and start empty?')&&confirm('This cannot be undone. Continue?')){const u=DB.users,s=APP.seed();Object.keys(s).forEach(k=>{if(Array.isArray(s[k]))s[k]=[];else if(typeof s[k]=='object'&&k!='settings')s[k]={}});s.settings=DB.settings;s.users=u;s.sample=0;DB=s;save();toast('All data erased');boot()}}}
document.body.insertAdjacentHTML('beforeend','<div id="app"></div><dialog id="md"></dialog><div id="pr"></div><div id="toast"></div>');

boot();
</script>
</body>
</html>
